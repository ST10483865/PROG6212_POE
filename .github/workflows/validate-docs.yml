name: Validate Docs Folder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check ERD image exists
        run: |
          if ! find docs -iname "*erd*" \( -iname "*.png" -o -iname "*.pdf" \) | grep -q .; then
            echo "ERROR: No ERD image (PNG or PDF) found in /docs."
            exit 1
          fi
          echo "ERD file found."

      - name: Check API endpoint plan exists
        run: |
          if ! find docs -iname "*endpoint*" \( -iname "*.md" -o -iname "*.pdf" \) | grep -q .; then
            echo "ERROR: No API endpoint plan (Markdown or PDF) found in /docs."
            exit 1
          fi
          echo "API endpoint plan found."

      - name: Check SQL script exists
        run: |
          if ! find docs -iname "*.sql" | grep -q .; then
            echo "ERROR: No .sql script found in /docs."
            exit 1
          fi
          echo "SQL script found."
          

      - name: All required files present
        run: echo "docs folder structure is valid — ERD, endpoint plan, and SQL script all found."
